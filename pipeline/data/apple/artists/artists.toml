# Artistas do modo por artista (M13), na ordem da tela (P118). O id é o da loja JP da Apple: os
# nomes são ambíguos na loja (há uma LISA do BLACKPINK, um Eve do rap, outros Aimer), então a
# lista nunca usa o nome. Regras de curadoria (P136):
#   exclude_albums: collectionId de álbum que não entra (ex.: os E-SIDE do YOASOBI, em inglês)
#   exclude_tracks: trackId de faixa que não entra
#   same_song: pares de trackId da mesma música com títulos que a chave não junta (o 2º vai para
#     o grupo do 1º)
#   singles: um trackId de cada música lançada como single (lado A), P172. Só para artista com
#     catálogo maior que o teto: o lookup de músicas só ordena 200 faixas, e no resto o single
#     vem antes das faixas de álbum

