# Artistas do modo por artista (M13), na ordem da tela (P118). O id é o da loja JP da Apple: os
# nomes são ambíguos na loja (há uma LISA do BLACKPINK, um Eve do rap, outros Aimer), então a
# lista nunca usa o nome. Regras de curadoria (P136):
#   exclude_albums: collectionId de álbum que não entra (ex.: os E-SIDE do YOASOBI, em inglês)
#   exclude_tracks: trackId de faixa que não entra
#   same_song: pares de trackId da mesma música com títulos que a chave não junta (o 2º vai para
#     o grupo do 1º)

[[artists]]
id = "1490256993"  # YOASOBI
# Os E-SIDE 1 a 4 são as mesmas músicas em inglês (P124), com títulos sem sufixo ("Idol" é アイドル).
# E também os singles em inglês sem o sufixo: Idol, Adventure e Monotone (- Single).
exclude_albums = [
  "1590852953",
  "1652016295",
  "1737193089",
  "1894825130",
  "1688334284",
  "1728037259",
  "1770010365",
  # e os singles das traduções com outro título: On the Stage, The Blessing, The Brave e
  # The Swallow (feat. Midories).
  "1760460644",
  "1652014298",
  "1717130268",
  "1650746027",
]
# "the NOISE" é do LE SSERAFIM, com o YOASOBI creditado só por um sample de 夜に駆ける (P160).
exclude_tracks = ["1841835717"]

