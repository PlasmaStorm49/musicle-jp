# --- Bolbbalgan4: o que só existe em hangul (P203) ---
# A leitura pela Romanização Revisada (국어의 로마자 표기법; a norma de 2014, na cópia do Wikisource),
# conferida no Wiktionary: 좋다고 se lê [조타고] (a aspiração do ㅎ, cap. 3, art. 1.4), e o 의 se
# escreve "ui" mesmo quando soa "i" (cap. 2, art. 1). O cutlet não lê hangul (ME84).

# O título em inglês, na busca: o da Wikipédia em inglês e da lista do MAMA 2017, e o da Apple US
# para a versão japonesa, 好きだと言って ("Tell Me You Love Me (Japanese Edition)").
