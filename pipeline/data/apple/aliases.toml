# Curadoria manual da parada real (Apple). Vale sobre o provedor e sobre o romaji automático.
#
# Chave = ID do catálogo. Seções: tracks, albums, artists.
#   latin   = título latino exibido (Hepburn; latinSource "manual")
#   aliases = termos extras de busca, nunca exibidos
#   block   = true tira a faixa do desafio diário
#
# Revise o diff de pipeline/data/apple/romaji.json a cada parada nova e corrija aqui o que o
# cutlet errou. Nome de artista quase nunca precisa: o lookup da Apple traz o latino oficial.

# --- Revisão da 1ª parada real (10/10/2026) ---

