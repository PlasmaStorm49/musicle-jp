[build-system]
# Versão exata e com 14 dias ou mais (P60): o build isolado do pip não lê o constraints.txt.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicle-pipeline"
version = "0.1.0"
description = "Gera o catálogo (e, a partir do M3, a agenda) do musicle-jp"
# Outra versão do Python traz outra versão do Unicode e mudaria bytes do catálogo.
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
# Versões exatas: o estilo do formatador e o comportamento dos testes não podem variar entre máquinas.
dev = ["pytest==9.1.1", "ruff==0.16.9"]
# Só o comando `romanize` usa. O build lê o cache romaji.json do provedor e nunca importa isto.
# Todas as versões fixas, inclusive as indiretas: qualquer uma pode mudar o romaji gerado.
romaji = [
  "cutlet==0.5.2",
  "fugashi==1.5.2",
  "unidic-lite==1.0.8",
  "jaconv==0.5.0",
  "mojimoji==0.0.13",
]

[project.scripts]
musicle-pipeline = "musicle_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID"]
# RUF001 a RUF003 avisam de "caractere Unicode ambíguo"; aqui o texto japonês é proposital.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Caracteres japoneses contam largura 2, e os testes têm muitos literais.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["musicle_pipeline"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "O build não pode depender do relógio: use a data do snapshot."
"datetime.datetime.utcnow".msg = "O build não pode depender do relógio: use a data do snapshot."
"datetime.date.today".msg = "O build não pode depender do relógio: use a data do snapshot."
"time.time".msg = "O build não pode depender do relógio: use a data do snapshot."
"random".msg = "Sorteio só com o PRNG com semente (M3)."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # permite `from helpers import ...` com o modo importlib
addopts = ["--import-mode=importlib", "-ra"]
