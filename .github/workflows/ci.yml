# Verificação completa a cada PR e a cada push na main. As três tarefas (pipeline, web, e2e)
# são as checagens obrigatórias da proteção da main: não renomeie sem atualizar o ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token só lê o repositório: nenhuma tarefa daqui precisa escrever.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior. Cada push na main tem grupo próprio
# (run_id): num grupo compartilhado, a execução pendente seria cancelada pela seguinte.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

# Actions pinadas por SHA (uma tag pode ser movida; o SHA não), em versões com 14 dias ou mais
# de publicadas, a mesma regra das dependências (P28). Versão no comentário.
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o schedule-check compara com outra revisão
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            pipeline/constraints.txt
      # O teste cruzado Python × TS e o do PRNG rodam o núcleo no Node; sem ele, pulam.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Antes do pytest: o teste do hook formata com o Biome do web/node_modules.
      - run: npm ci --prefix web
      # Sem o extra romaji (250 MB): o teste dele pula e o romanize --check não precisa dele.
      # Versões exatas, inclusive as indiretas, com 14 dias ou mais (P60).
      - run: python -m pip install -c pipeline/constraints.txt -e "pipeline[dev]"
      - run: python -m ruff check pipeline .claude/hooks
      - run: python -m ruff format --check pipeline .claude/hooks
      - run: python -m pytest pipeline -q
      - run: python -m musicle_pipeline romanize --provider fixture --check
      - run: python -m musicle_pipeline validate web/public/fixtures/catalog.json --schedule web/public/fixtures/schedule.json
      - name: Agenda só cresceu
        # Valores do evento entram por env, nunca direto no script (injeção de comando).
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # O PR roda no commit de merge de teste: o 1º pai é a base exata do que foi testado
            # (a ponta da main pode ter andado depois).
            base="HEAD^1"
          elif [ "$CREATED" != "true" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="HEAD^1" # branch novo (before = 000...) ou revisão inalcançável
          fi
          echo "Comparando a agenda com: $base"
          python -m musicle_pipeline schedule-check --base-ref "$base"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Motor de áudio falso fora do build
        run: |
          # Sem dist, o grep sairia com erro e o if leria "não achou": a checagem passaria calada.
          test -d dist || { echo "::error::dist não existe"; exit 1; }
          if grep -rq "musicle-fake-audio" dist; then
            echo "::error::o motor de áudio falso foi parar no build de produção"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            pipeline/constraints.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Áudio e capas falsos (fora do Git): as capas aparecem na tela e erro 404 sujaria o console.
      - run: python -m pip install -c pipeline/constraints.txt -e pipeline
      - run: python -m musicle_pipeline fake-assets --catalog web/public/fixtures/catalog.json
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
