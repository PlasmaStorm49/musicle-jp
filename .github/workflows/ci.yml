# Verificação completa a cada PR e a cada push na main. As três tarefas (pipeline, web, e2e)
# são as checagens obrigatórias da proteção da main: não renomeie sem atualizar o ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token só lê o repositório: nenhuma tarefa daqui precisa escrever.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior. Cada push na main tem grupo próprio
# (run_id): num grupo compartilhado, a execução pendente seria cancelada pela seguinte.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

# Actions pinadas por SHA (uma tag pode ser movida; o SHA não), em versões com 14 dias ou mais
# de publicadas, a mesma regra das dependências (P28). Versão no comentário.
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o schedule-check compara com outra revisão
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            pipeline/constraints.txt
      # O teste cruzado Python × TS e o do PRNG rodam o núcleo no Node; sem ele, pulam.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Antes do pytest: o teste do hook formata com o Biome do web/node_modules.
      - run: npm ci --prefix web
      # Sem o extra romaji (250 MB): o teste dele pula e o romanize --check não precisa dele.
      # Versões exatas, inclusive as indiretas, com 14 dias ou mais (P60).
      - run: python -m pip install -c pipeline/constraints.txt -e "pipeline[dev]"
      - run: python -m ruff check pipeline .claude/hooks
      - run: python -m ruff format --check pipeline .claude/hooks
      - run: python -m pytest pipeline -q
      - run: python -m musicle_pipeline romanize --provider fixture --check
      - run: python -m musicle_pipeline validate web/public/fixtures/catalog.json --schedule web/public/fixtures/schedule.json
      # Modo por artista (M13), fictício: romaji em dia e a pasta publicada válida (o pytest
      # confere que ela é exatamente o que o build-artists gera).
      - run: python -m musicle_pipeline romanize --provider fixture --artists --check
      - run: python -m musicle_pipeline validate-artists --provider fixture
      # Parada real (Apple): romaji em dia, catálogo e agenda válidos. Sem rede: tudo sai dos
      # snapshots versionados em pipeline/data/apple/ (o pytest confere que o catálogo está em dia
      # com eles). O schedule-check abaixo confere as duas agendas.
      - run: python -m musicle_pipeline romanize --provider apple --check
      - run: python -m musicle_pipeline validate web/public/data/catalog.json --schedule web/public/data/schedule.json
      # Modo por artista real (M13): romaji em dia e a pasta publicada válida, a partir dos
      # snapshots versionados em pipeline/data/apple/artists/ (sem rede).
      - run: python -m musicle_pipeline romanize --provider apple --artists --check
      - run: python -m musicle_pipeline validate-artists --provider apple
      # O Anime (M14): o catálogo e a agenda, os fictícios e os reais (desde a carga de teste,
      # C1), a partir dos snapshots versionados em pipeline/data/apple/anime/ (sem rede). O
      # validate-anime confere o teto de 3 MB e a agenda ao lado do catálogo; o pytest, que o
      # catálogo está em dia com os snapshots.
      - run: python -m musicle_pipeline validate-anime --provider fixture
      - run: python -m musicle_pipeline validate-anime --provider apple
      - name: Agenda só cresceu
        # Valores do evento entram por env, nunca direto no script (injeção de comando).
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # O PR roda no commit de merge de teste: o 1º pai é a base exata do que foi testado
            # (a ponta da main pode ter andado depois).
            base="HEAD^1"
          elif [ "$CREATED" != "true" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="HEAD^1" # branch novo (before = 000...) ou revisão inalcançável
          fi
          # Hoje em Brasília (P44): dia novo não pode ter passado. E os dias novos precisam ser os
          # que o gerador daria com o catálogo do mesmo commit (regra inviolável 3, ME45 e ME51).
          today="$(TZ=America/Sao_Paulo date +%F)"
          echo "Comparando a agenda com: $base (hoje em Brasília: $today)"
          python -m musicle_pipeline schedule-check --base-ref "$base" --today "$today"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Motor de áudio falso fora do build
        run: |
          # Sem dist, o grep sairia com erro e o if leria "não achou": a checagem passaria calada.
          test -d dist || { echo "::error::dist não existe"; exit 1; }
          if grep -rq "musicle-fake-audio" dist; then
            echo "::error::o motor de áudio falso foi parar no build de produção"
            exit 1
          fi
      - name: Lista de exemplo das medalhas fora do build
        run: |
          # A lista de exemplo (?medalhas=demo, M16) sai do build pelo literal import.meta.env.DEV no
          # ponto da escolha (web/CLAUDE.md, regra 10). Os textos dela (medal.demo-...) ficam no
          # pacote, com o resto do i18n; o objeto de uma delas ({id:"demo-...", minificado), não.
          test -d dist || { echo "::error::dist não existe"; exit 1; }
          if grep -rqE "id:[\"'\`]demo-" dist; then
            echo "::error::a lista de exemplo das medalhas foi parar no build de produção"
            exit 1
          fi
      - name: Base do GitHub Pages no build
        run: |
          # O Pages publica em /musicle-jp/: sem a base, os assets dariam 404 e a página ficaria
          # em branco (web/vite.config.ts).
          grep -Eq '(src|href)="/musicle-jp/assets/' dist/index.html || { echo "::error::dist/index.html não usa /musicle-jp/assets/"; exit 1; }
          # Todo caminho absoluto leva a base, e não só os assets: o favicon e o ícone de app
          # também, e qualquer atributo (um srcset, o content de uma og:image) (ME83). O grep -v
          # mostra no log o caminho sem ela.
          if grep -Eo '="/[^"]*"' dist/index.html | grep -v '="/musicle-jp/'; then
            echo "::error::dist/index.html tem caminho absoluto sem a base /musicle-jp/"
            exit 1
          fi
          for file in favicon.svg apple-touch-icon.png; do
            test -f "dist/$file" || { echo "::error::dist/$file não existe"; exit 1; }
          done

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            pipeline/constraints.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Áudio e capas falsos (fora do Git): as capas aparecem na tela e erro 404 sujaria o console.
      - run: python -m pip install -c pipeline/constraints.txt -e pipeline
      - run: python -m musicle_pipeline fake-assets --catalog web/public/fixtures/catalog.json
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
