# Publica o site no GitHub Pages a cada push na main (o merge de um PR) e sob demanda.
# Os nomes das tarefas fogem de pipeline, web e e2e: esses são as checagens obrigatórias da main,
# e uma tarefa com o mesmo nome viraria checagem com o mesmo nome.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nada por padrão: cada tarefa pede só o que usa.
permissions: {}

# Um deploy por vez. O que chega enquanto outro roda espera (o mais novo substitui o pendente);
# cancelar um deploy no meio poderia deixar o site pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions pinadas por SHA, em versões com 14 dias ou mais de publicadas (P28). Versão no comentário.
jobs:
  pages-build:
    # O workflow_dispatch aceita qualquer branch; só a main publica (o ambiente github-pages
    # também só aceita a main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      # Desde o M11 o site publicado lê a parada real (data/), e o áudio vem da Apple. O Vite
      # copia o public/ inteiro: as fixtures (e, numa máquina com fake-assets, 26 MB de WAV)
      # sairiam junto.
      - run: rm -rf web/dist/fixtures
      - name: Conferir o site antes de publicar
        working-directory: web
        run: |
          grep -Eq '(src|href)="/musicle-jp/assets/' dist/index.html || { echo "::error::dist/index.html sem a base /musicle-jp/"; exit 1; }
          # Todo caminho absoluto leva a base, como na CI (ME83).
          if grep -Eo '="/[^"]*"' dist/index.html | grep -v '="/musicle-jp/'; then
            echo "::error::dist/index.html tem caminho absoluto sem a base /musicle-jp/"
            exit 1
          fi
          for file in favicon.svg apple-touch-icon.png; do
            test -f "dist/$file" || { echo "::error::dist/$file não existe"; exit 1; }
          done
          if grep -rq "musicle-fake-audio" dist; then
            echo "::error::o motor de áudio falso foi parar no build"
            exit 1
          fi
          # A lista de exemplo das medalhas (?medalhas=demo), como na CI.
          if grep -rqE "id:[\"'\`]demo-" dist; then
            echo "::error::a lista de exemplo das medalhas foi parar no build"
            exit 1
          fi
          # O laboratório das Misturadas (web/lab.html, M17), só do servidor de desenvolvimento.
          if [ -e dist/lab.html ] || grep -rq "musicle-lab" dist; then
            echo "::error::o laboratório das Misturadas foi parar no build"
            exit 1
          fi
          # Nenhum áudio no site: as prévias tocam do servidor da Apple (termos da Apple). O
          # -print -quit, e não "find | grep -q": com pipefail ligado (shell: bash), o SIGPIPE do
          # find faria o if achar que não havia WAV; assim não depende do shell.
          if [ -e dist/fixtures ] || [ -n "$(find dist -name '*.wav' -print -quit)" ]; then
            echo "::error::fixtures ou WAV no build"
            exit 1
          fi
          jq -e '.provider == "apple"' dist/data/catalog.json > /dev/null \
            || { echo "::error::dist/data/catalog.json não é a parada real"; exit 1; }
          # Modo por artista (M13): a lista é a real e não está vazia, cada arquivo dela existe e
          # nenhum passa de 1 MB (o validate-artists da CI confere o resto). O "não vazia" é do
          # jq -e: uma falha dentro do $(...) do for não pararia o passo, e o laço passaria calado.
          jq -e '.provider == "apple" and (.artists | length > 0)' dist/data/artists/index.json \
            > /dev/null || { echo "::error::dist/data/artists/index.json não é a lista real"; exit 1; }
          for file in $(jq -r '.artists[].file' dist/data/artists/index.json); do
            [ -f "dist/data/artists/$file" ] || { echo "::error::falta dist/data/artists/$file"; exit 1; }
          done
          if [ -n "$(find dist/data/artists -size +1024k -print -quit)" ]; then
            echo "::error::arquivo do modo por artista com mais de 1 MB"
            exit 1
          fi
          # Folga da agenda (ME14): o PR semanal do robô acrescenta os dias. Aviso, não erro: um
          # deploy de correção não pode travar porque a agenda está curta.
          today=$(TZ=America/Sao_Paulo date +%F)
          jq -e --arg d "$today" '.days | has($d)' dist/data/schedule.json > /dev/null \
            || echo "::warning::a agenda não tem o dia de hoje ($today)"
          ahead=$(jq --arg d "$today" '[.days | keys[] | select(. > $d)] | length' dist/data/schedule.json)
          [ "$ahead" -ge 7 ] || echo "::warning::só $ahead dia(s) de agenda depois de hoje ($today)"
          echo "Agenda: $ahead dia(s) depois de hoje ($today)." >> "$GITHUB_STEP_SUMMARY"
          # O Anime (M14): o catálogo é o real (o validate-anime da CI confere o resto, inclusive
          # o teto de 3 MB). A folga da agenda é aviso, como a dos Hits: o robô semanal a cresce
          # quando ela tem menos de 21 dias à frente (PR B), e a catalog-runway avisa com menos de 10.
          jq -e '.provider == "apple"' dist/data/anime/catalog.json > /dev/null             || { echo "::error::dist/data/anime/catalog.json não é o Anime real"; exit 1; }
          jq -e --arg d "$today" '.days | has($d)' dist/data/anime/schedule.json > /dev/null             || echo "::warning::a agenda do Anime não tem o dia de hoje ($today)"
          anime=$(jq --arg d "$today" '[.days | keys[] | select(. > $d)] | length' dist/data/anime/schedule.json)
          [ "$anime" -ge 7 ] || echo "::warning::só $anime dia(s) de agenda do Anime depois de hoje ($today)"
          echo "Agenda do Anime: $anime dia(s) depois de hoje ($today)." >> "$GITHUB_STEP_SUMMARY"
          # As Misturadas (M17): a mesma folga, também só aviso. A agenda delas para no último dia
          # da do Anime (P25) e cresce com ela no robô.
          jq -e --arg d "$today" '.days | has($d)' dist/data/anime/mixed.json > /dev/null \
            || echo "::warning::a agenda das Misturadas não tem o dia de hoje ($today)"
          mixed=$(jq --arg d "$today" '[.days | keys[] | select(. > $d)] | length' dist/data/anime/mixed.json)
          [ "$mixed" -ge 7 ] || echo "::warning::só $mixed dia(s) de agenda das Misturadas depois de hoje ($today)"
          echo "Agenda das Misturadas: $mixed dia(s) depois de hoje ($today)." >> "$GITHUB_STEP_SUMMARY"
          du -sh dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publicar no Pages
      id-token: write # o deploy-pages prova a origem do artefato com um token OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
